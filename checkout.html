<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELÓRA – Checkout</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }

    .checkout {
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      letter-spacing: 7px;
      margin-bottom: 45px;
    }

    .label {
      font-size: 10px;
      letter-spacing: 4px;
      opacity: 0.6;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 48px;
      font-weight: normal;
      margin-bottom: 35px;
    }

    .product {
      padding: 25px 0;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      margin-bottom: 35px;
    }

    .product h2 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .size {
      font-size: 14px;
      opacity: 0.7;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      background: #151515;
      border: 1px solid #333;
      color: white;
      outline: none;
      font-size: 14px;
    }

    textarea {
      height: 110px;
      resize: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .order-btn {
      background: white;
      color: black;
    }

    .pay-btn {
      background: white;
      color: black;
    }

    .paid-btn {
      background: #ddd;
      color: black;
    }

    button:hover {
      opacity: 0.85;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .error {
      color: #ff7777;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: 42px;
      }

      .checkout {
        margin-top: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="checkout">

    <div class="logo">VELÓRA</div>

    <p class="label">SECURE CHECKOUT</p>

    <h1>Your Order</h1>

    <div class="error" id="errorMessage">
      Product information not found. Please go back and select the product again.
    </div>

    <div class="product">

      <h2 id="productName">Loading...</h2>

      <p class="price" id="productPrice">₹0</p>

      <p class="size" id="productSize">Size: Not selected</p>

    </div>

    <input
      type="text"
      id="customerName"
      placeholder="Full Name"
      autocomplete="name"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Phone Number"
      autocomplete="tel"
    >

    <textarea
      id="address"
      placeholder="Delivery Address"
    ></textarea>

    <button
      class="order-btn"
      id="orderBtn"
    >
      PLACE ORDER
    </button>

    <button
      class="pay-btn"
      id="payBtn"
    >
      PAY NOW
    </button>

    <button
      class="paid-btn"
      id="paidBtn"
    >
      I HAVE PAID - SEND ORDER
    </button>

    <a href="index.html" class="back">
      ← BACK TO SHOP
    </a>

  </main>

  <script>

    /* =====================================
       GET PRODUCT INFORMATION
       ===================================== */

    const params = new URLSearchParams(
      window.location.search
    );

    const productName =
      params.get("name") || "";

    const productPrice =
      params.get("price") || "";

    const productSize =
      params.get("size") || "";

    const nameElement =
      document.getElementById("productName");

    const priceElement =
      document.getElementById("productPrice");

    const sizeElement =
      document.getElementById("productSize");

    const errorMessage =
      document.getElementById("errorMessage");


    /* =====================================
       DISPLAY PRODUCT
       ===================================== */

    if (productName) {
      nameElement.textContent = productName;
    } else {
      nameElement.textContent = "Product";
    }


    if (productPrice) {
      priceElement.textContent =
        productPrice.startsWith("₹")
          ? productPrice
          : "₹" + productPrice;
    } else {
      priceElement.textContent = "₹0";
    }


    if (productSize) {
      sizeElement.textContent =
        "Size: " + productSize;
    }


    if (!productName || !productPrice) {
      errorMessage.style.display = "block";
    }


    /* =====================================
       WHATSAPP NUMBER
       ===================================== */

    const whatsappNumber = "919030779918";


    /* =====================================
       CREATE ORDER MESSAGE
       ===================================== */

    function createOrderMessage() {

      const name =
        document.getElementById("customerName").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const address =
        document.getElementById("address").value.trim();


      if (!name || !phone || !address) {

        alert("Please fill all details.");

        return null;
      }


      const message =
        "🛍️ VELÓRA NEW ORDER\n\n" +
        "Product: " + productName + "\n" +
        "Price: " + priceElement.textContent + "\n" +
        "Size: " + (productSize || "Not selected") + "\n\n" +
        "Customer: " + name + "\n" +
        "Phone: " + phone + "\n" +
        "Address: " + address;


      return message;
    }


    /* =====================================
       PLACE ORDER
       ===================================== */

    document
      .getElementById("orderBtn")
      .addEventListener("click", function () {

        const message = createOrderMessage();

        if (!message) return;


        localStorage.setItem(
          "veloraOrder",
          JSON.stringify({
            product: productName,
            price: productPrice,
            size: productSize,
            customer: name,
            phone: phone,
            address: address
          })
        );


        const whatsappURL =
          "https://wa.me/" +
          whatsappNumber +
          "?text=" +
          encodeURIComponent(message);


        window.location.href = whatsappURL;

      });


    /* =====================================
       PAY NOW
       ===================================== */

    document
      .getElementById("payBtn")
      .addEventListener("click", function () {

        const name =
          document.getElementById("customerName").value.trim();

        const phone =
          document.getElementById("phone").value.trim();

        const address =
          document.getElementById("address").value.trim();


        if (!name || !phone || !address) {

          alert("Please fill all details before payment.");

          return;
        }


        let amount =
          productPrice
            .replace("₹", "")
            .replace(",", "")
            .trim();


        if (!amount || isNaN(amount)) {

          alert("Product price is not available.");

          return;
        }


        /*
          UPI PAYMENT

          Change the UPI ID below
          to your real UPI ID.
        */

        const upiID = "yourupi@upi";

        const payeeName = "VELORA";


        const upiURL =
          "upi://pay?" +
          "pa=" + encodeURIComponent(upiID) +
          "&pn=" + encodeURIComponent(payeeName) +
          "&am=" + encodeURIComponent(amount) +
          "&cu=INR";


        window.location.href = upiURL;

      });


    /* =====================================
       I HAVE PAID
       ===================================== */

    document
      .getElementById("paidBtn")
      .addEventListener("click", function () {

        const message = createOrderMessage();

        if (!message) return;


        const paymentMessage =
          "💳 VELÓRA PAYMENT ORDER\n\n" +
          message +
          "\n\nPayment Status: I HAVE PAID";


        const whatsappURL =
          "https://wa.me/" +
          whatsappNumber +
          "?text=" +
          encodeURIComponent(paymentMessage);


        window.location.href = whatsappURL;

      });

  </script>

</body>
</html>
