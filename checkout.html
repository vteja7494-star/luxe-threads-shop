<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VÉLORA — Checkout</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }

    .checkout {
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      letter-spacing: 7px;
      margin-bottom: 45px;
    }

    .label {
      font-size: 10px;
      letter-spacing: 4px;
      opacity: 0.6;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 48px;
      font-weight: normal;
      margin-bottom: 35px;
    }

    .product {
      padding: 25px 0;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      margin-bottom: 35px;
    }

    .product h2 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .size {
      font-size: 14px;
      color: #aaa;
      letter-spacing: 2px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;

      background: #151515;
      border: 1px solid #333;

      color: white;
      outline: none;

      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: #777;
    }

    textarea {
      height: 110px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      cursor: pointer;

      font-size: 12px;
      letter-spacing: 3px;
    }

    .order-btn {
      background: white;
      color: black;
      margin-bottom: 10px;
    }

    .order-btn:hover {
      background: #ddd;
    }

    .pay-btn {
      background: white;
      color: black;
      margin-bottom: 10px;
    }

    .paid-btn {
      background: white;
      color: black;
    }

    button:hover {
      opacity: 0.85;
    }

    .back {
      display: inline-block;
      margin-top: 25px;

      color: white;
      text-decoration: none;

      font-size: 12px;
      letter-spacing: 2px;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      display: none;

      border: 1px solid #333;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      .checkout {
        margin: 20px auto;
      }

      h1 {
        font-size: 42px;
      }

      .product h2 {
        font-size: 27px;
      }

    }
  </style>
</head>

<body>

  <main class="checkout">

    <div class="logo">
      VÉLORA
    </div>

    <p class="label">
      SECURE CHECKOUT
    </p>

    <h1>
      Your Order
    </h1>


    <!-- PRODUCT -->

    <div class="product">

      <h2 id="productName">
        Loading...
      </h2>

      <p
        class="price"
        id="productPrice"
      >
        ₹0
      </p>

      <p
        class="size"
        id="productSize"
      >
        SIZE: —
      </p>

    </div>


    <!-- CUSTOMER DETAILS -->

    <input
      type="text"
      id="customerName"
      placeholder="Full Name"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Phone Number"
    >

    <textarea
      id="address"
      placeholder="Delivery Address"
    ></textarea>


    <!-- PLACE ORDER -->

    <button
      class="order-btn"
      id="orderBtn"
    >
      PLACE ORDER
    </button>


    <!-- PAY NOW -->

    <button
      class="pay-btn"
      id="payBtn"
    >
      PAY NOW ₹<span id="payAmount">0</span>
    </button>


    <!-- PAID -->

    <button
      class="paid-btn"
      id="paidBtn"
    >
      I HAVE PAID — SEND ORDER
    </button>


    <div
      class="message"
      id="message"
    ></div>


    <a
      href="index.html"
      class="back"
    >
      ← BACK TO SHOP
    </a>

  </main>


  <script>

    /* =========================
       GET PRODUCT INFORMATION
       ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    let productName =
      params.get("name");

    let productPrice =
      params.get("price");

    let productSize =
      params.get("size");


    /* =========================
       LOCAL STORAGE FALLBACK
       ========================= */

    const savedProduct =
      localStorage.getItem(
        "veloraProduct"
      );


    if (
      (!productName || !productPrice) &&
      savedProduct
    ) {

      try {

        const product =
          JSON.parse(savedProduct);

        productName =
          product.name;

        productPrice =
          product.price;

        productSize =
          product.size;

      } catch (error) {

        console.log(
          "Saved product could not be read."
        );

      }

    }


    /* =========================
       DEFAULT VALUES
       ========================= */

    if (!productName) {
      productName =
        "Midnight Elegance";
    }


    if (!productPrice) {
      productPrice =
        "₹4,999";
    }


    if (!productSize) {
      productSize =
        "Not selected";
    }


    /* =========================
       SHOW PRODUCT
       ========================= */

    document
      .getElementById("productName")
      .textContent =
      productName;


    document
      .getElementById("productPrice")
      .textContent =
      productPrice;


    document
      .getElementById("productSize")
      .textContent =
      "SIZE: " +
      productSize;


    /* =========================
       PAYMENT AMOUNT
       ========================= */

    const amount =
      productPrice
        .replace(/[₹,\s]/g, "")
        .replace(/[^0-9.]/g, "");


    document
      .getElementById("payAmount")
      .textContent =
      amount || "0";


    /* =========================
       CUSTOMER MESSAGE
       ========================= */

    function getCustomerDetails() {

      const name =
        document
          .getElementById("customerName")
          .value
          .trim();

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const address =
        document
          .getElementById("address")
          .value
          .trim();


      return {
        name,
        phone,
        address
      };

    }


    function validateDetails() {

      const details =
        getCustomerDetails();


      if (
        !details.name ||
        !details.phone ||
        !details.address
      ) {

        alert(
          "Please fill all details."
        );

        return null;

      }


      return details;

    }


    function createOrderMessage() {

      const details =
        validateDetails();


      if (!details) {
        return null;
      }


      const message =

        "🛍️ VÉLORA NEW ORDER\n\n" +

        "Product: " +
        productName +
        "\n" +

        "Price: " +
        productPrice +
        "\n" +

        "Size: " +
        productSize +
        "\n\n" +

        "Customer: " +
        details.name +
        "\n" +

        "Phone: " +
        details.phone +
        "\n" +

        "Address: " +
        details.address;


      return message;

    }


    /* =========================
       WHATSAPP NUMBER
       ========================= */

    const whatsappNumber =
      "919030779918";


    /* =========================
       PLACE ORDER
       ========================= */

    document
      .getElementById("orderBtn")
      .addEventListener(
        "click",
        function () {

          const message =
            createOrderMessage();


          if (!message) {
            return;
          }


          const whatsappURL =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(
              message
            );


          window.location.href =
            whatsappURL;

        }
      );


    /* =========================
       PAY NOW
       ========================= */

    document
      .getElementById("payBtn")
      .addEventListener(
        "click",
        function () {

          const details =
            validateDetails();


          if (!details) {
            return;
          }


          const upiURL =
            "upi://pay" +

            "?pa=9030779918@ybl" +

            "&pn=VELORA" +

            "&am=" +
            encodeURIComponent(
              amount
            ) +

            "&cu=INR";


          window.location.href =
            upiURL;

        }
      );


    /* =========================
       I HAVE PAID
       ========================= */

    document
      .getElementById("paidBtn")
      .addEventListener(
        "click",
        function () {

          const message =
            createOrderMessage();


          if (!message) {
            return;
          }


          const paymentMessage =

            "💰 VÉLORA PAYMENT\n\n" +

            message;


          const whatsappURL =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(
              paymentMessage
            );


          window.location.href =
            whatsappURL;

        }
      );


  </script>

</body>
</html>
