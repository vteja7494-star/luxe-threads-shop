<script>
const params = new URLSearchParams(window.location.search);

let name = params.get("name");
let price = params.get("price");
let size = params.get("size");

const saved = localStorage.getItem("veloraProduct");

if (saved) {
  try {
    const product = JSON.parse(saved);

    if (!name) name = product.name;
    if (!price) price = product.price;
    if (!size) size = product.size;

  } catch (e) {
    console.log(e);
  }
}

name = name || "Midnight Elegance";
price = price || "₹4,999";
size = size || "Not selected";

document.getElementById("productName").textContent = name;
document.getElementById("productPrice").textContent = price;
document.getElementById("productSize").textContent = "SIZE: " + size;

const amount = price.replace(/[₹,\s]/g, "");

document.getElementById("payAmount").textContent = amount || "4999";


document.getElementById("orderBtn").onclick = function () {

  const customerName =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  if (!customerName || !phone || !address) {
    alert("Please fill all details.");
    return;
  }

  const message =
    "🛍️ VÉLORA NEW ORDER\n\n" +
    "Product: " + name + "\n" +
    "Price: " + price + "\n" +
    "Size: " + size + "\n\n" +
    "Customer: " + customerName + "\n" +
    "Phone: " + phone + "\n" +
    "Address: " + address;

  window.location.href =
    "https://wa.me/919030779918?text=" +
    encodeURIComponent(message);
};


document.getElementById("paidBtn").onclick = function () {

  const customerName =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  if (!customerName || !phone || !address) {
    alert("Please fill all details.");
    return;
  }

  const message =
    "💰 VÉLORA PAYMENT\n\n" +
    "Product: " + name + "\n" +
    "Price: " + price + "\n" +
    "Size: " + size + "\n\n" +
    "Customer: " + customerName + "\n" +
    "Phone: " + phone + "\n" +
    "Address: " + address;

  window.location.href =
    "https://wa.me/919030779918?text=" +
    encodeURIComponent(message);
};
</script>
