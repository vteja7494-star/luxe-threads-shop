<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VÉLORA — Premium Fashion</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">VÉLORA</div>

    <div class="nav-icons">
      <span>♡</span>
      <span>🛍</span>
    </div>
  </header>

  <main class="fashion-feed">

    <section class="dress-card">
      <div class="dress-info">
        <p class="collection">NEW COLLECTION</p>
        <h1>Midnight Elegance</h1>
        <p class="price">₹4,999</p>

        <button>VIEW DETAILS</button>
      </div>
    </section>

    <section class="dress-card">
      <div class="dress-info">
        <p class="collection">VÉLORA COLLECTION</p>
        <h1>Golden Evening</h1>
        <p class="price">₹6,499</p>

        <button>VIEW DETAILS</button>
      </div>
    </section>

    <section class="dress-card">
      <div class="dress-info">
        <p class="collection">SIGNATURE EDIT</p>
        <h1>Royal Noir</h1>
        <p class="price">₹7,999</p>

        <button>VIEW DETAILS</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
