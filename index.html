
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VÉLORA — Premium Fashion</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">VÉLORA</div>

    <div class="icons">
      <button class="icon-btn">♡</button>
      <button class="icon-btn">🛍</button>
    </div>
  </header>

  <div class="scroll-hint">
    SWIPE
    <span>↓</span>
  </div>

  <main class="fashion-feed">

    <!-- DRESS 1 -->
    <section class="dress-card dress-one">

      <div class="dress-image"></div>

      <div class="overlay"></div>

      <div class="dress-info">
        <p class="collection">VÉLORA / NEW COLLECTION</p>

        <h1>Midnight<br>Elegance</h1>

        <p class="description">
          Timeless luxury for unforgettable evenings.
        </p>

        <div class="bottom-row">
          <div>
            <span class="price">₹4,999</span>
          </div>

          <button class="details-btn">VIEW DETAILS</button>
        </div>
      </div>

    </section>


    <!-- DRESS 2 -->
    <section class="dress-card dress-two">

      <div class="dress-image"></div>

      <div class="overlay"></div>

      <div class="dress-info">
        <p class="collection">VÉLORA / SIGNATURE</p>

        <h1>Golden<br>Evening</h1>

        <p class="description">
          Designed to make every moment feel luxurious.
        </p>

        <div class="bottom-row">
          <div>
            <span class="price">₹6,499</span>
          </div>

          <button class="details-btn">VIEW DETAILS</button>
        </div>
      </div>

    </section>


    <!-- DRESS 3 -->
    <section class="dress-card dress-three">

      <div class="dress-image"></div>

      <div class="overlay"></div>

      <div class="dress-info">
        <p class="collection">VÉLORA / ROYAL EDIT</p>

        <h1>Royal<br>Noir</h1>

        <p class="description">
          Bold. Elegant. Made for the spotlight.
        </p>

        <div class="bottom-row">
          <div>
            <span class="price">₹7,999</span>
          </div>

          <button class="details-btn">VIEW DETAILS</button>
        </div>
      </div>

    </section>

  </main>

  <script src="./script.js"></script>

</body>
</html>
