<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VÉLORA — Premium Fashion</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">VÉLORA</div>

    <div class="nav-icons">
      <button id="heartBtn">♡</button>
      <button id="bagBtn">🛍️</button>
    </div>
  </header>

  <main class="fashion-feed">

    <!-- PRODUCT 1 -->
    <section class="dress-card">
      <div class="dress-info">
        <p class="collection">NEW COLLECTION</p>

        <h1>Midnight Elegance</h1>

        <p class="price">₹4,999</p>

        <button class="details-btn">
          VIEW DETAILS
        </button>
      </div>
    </section>


    <!-- PRODUCT 2 -->
    <section class="dress-card">
      <div class="dress-info">
        <p class="collection">VÉLORA COLLECTION</p>

        <h1>Golden Evening</h1>

        <p class="price">₹6,499</p>

        <button class="details-btn">
          VIEW DETAILS
        </button>
      </div>
    </section>


    <!-- PRODUCT 3 -->
    <section class="dress-card">
      <div class="dress-info">
        <p class="collection">SIGNATURE EDIT</p>

        <h1>Royal Noir</h1>

        <p class="price">₹7,999</p>

        <button class="details-btn">
          VIEW DETAILS
        </button>
      </div>
    </section>

  </main>

  <script src="script.js" defer></script>
<div id="productModal" class="product-modal">

  <div class="product-box">

    <button id="closeProduct" class="close-product">×</button>

    <p class="product-label">VÉLORA EXCLUSIVE</p>

    <h2 id="productName">Midnight Elegance</h2>

    <p id="productPrice">₹4,999</p>

    <p class="product-description">
      Premium fashion designed with an elegant silhouette
      and luxurious finish.
    </p>

    <div class="sizes">
      <button>S</button>
      <button>M</button>
      <button>L</button>
      <button>XL</button>
    </div>

    <button id="buyNow" class="buy-btn">
      BUY NOW
    </button>

  </div>

</div>
</body>
</html>
